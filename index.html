<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sphero Control" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <title>Sphero Control</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: #0f0f1a;
      --panel2: #141428;
      --border: #1e1e3f;
      --accent: #00f0ff;
      --accent2: #7b2fff;
      --accent3: #ff2f6e;
      --green: #00ff88;
      --warn: #ffaa00;
      --text: #c8d8e8;
      --dim: #4a5a6a;
      --glow: 0 0 12px var(--accent), 0 0 24px rgba(0,240,255,0.3);
      --glow2: 0 0 12px var(--accent2), 0 0 24px rgba(123,47,255,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.06) 2px,
        rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 1000;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 10px;
      gap: 8px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-shadow: var(--glow);
    }

    h1 span { color: var(--accent2); }

    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--dim);
      transition: background 0.3s, box-shadow 0.3s;
    }
    #status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
    #status-dot.connecting { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 0.8s infinite; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Status bar */
    #status-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .stat-chip {
      flex: 1;
      min-width: 80px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-chip .label { color: var(--dim); font-size: 0.65rem; text-transform: uppercase; }
    .stat-chip .value { color: var(--accent); font-size: 0.85rem; }
    .stat-chip .value.green { color: var(--green); }
    .stat-chip .value.warn { color: var(--warn); }
    .stat-chip .value.red { color: var(--accent3); }

    /* Main area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    /* Visualizer */
    #visualizer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    #viz-canvas {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: radial-gradient(circle at 50% 50%, #0d0d20, #08080f);
    }

    #heading-display {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      text-shadow: var(--glow);
      letter-spacing: 0.1em;
    }

    /* Controls row */
    #controls-row {
      display: flex;
      gap: 8px;
    }

    /* Connect buttons */
    .btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      background: var(--panel2);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      flex: 1;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.96); }
    .btn.primary {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn.primary:hover { background: rgba(0,240,255,0.08); box-shadow: var(--glow); }
    .btn.secondary {
      border-color: var(--accent2);
      color: var(--accent2);
    }
    .btn.secondary:hover { background: rgba(123,47,255,0.08); box-shadow: var(--glow2); }
    .btn.danger {
      border-color: var(--accent3);
      color: var(--accent3);
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Color picker section */
    #color-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }

    .section-label {
      font-size: 0.65rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    #color-presets {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .color-swatch {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .color-swatch:active { transform: scale(0.85); }
    .color-swatch.active { border-color: white; transform: scale(1.15); }

    #custom-color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="color"] {
      width: 40px; height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: none;
      cursor: pointer;
      padding: 2px;
    }

    #custom-color-label {
      font-size: 0.7rem;
      color: var(--dim);
    }

    /* Speed / heading controls */
    #params-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      gap: 10px;
    }

    .param-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .param-label {
      font-size: 0.65rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      cursor: pointer;
    }

    .param-value {
      font-size: 0.75rem;
      color: var(--accent);
      text-align: right;
    }

    /* Log */
    #log {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      overflow-y: auto;
      font-size: 0.68rem;
      line-height: 1.6;
      min-height: 60px;
      max-height: 100px;
    }

    .log-line { color: var(--dim); }
    .log-line.info { color: var(--text); }
    .log-line.ok { color: var(--green); }
    .log-line.error { color: var(--accent3); }
    .log-line.warn { color: var(--warn); }
    .log-line::before { content: '> '; color: var(--accent2); }

    /* Gamepad indicator */
    #gamepad-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      color: var(--dim);
    }
    #gamepad-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--dim);
    }
    #gamepad-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* Action buttons */
    #action-row {
      display: flex;
      gap: 6px;
    }

    /* Heading reset */
    #aim-section {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Override/emergency stop */
    #estop {
      background: var(--accent3);
      color: #000;
      font-weight: 700;
      border-color: var(--accent3);
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.1em;
    }
    #estop:active { background: #ff0044; }

    /* Notification toast */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--panel2);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      transition: transform 0.25s;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>SPHERO<span>CTRL</span></h1>
    <div id="gamepad-indicator">
      <div id="gamepad-dot"></div>
      <span id="gamepad-label">No gamepad</span>
    </div>
    <div id="status-dot"></div>
  </header>

  <div id="status-bar">
    <div class="stat-chip">
      <span class="label">Sphero</span>
      <span class="value" id="sphero-status">Disconnected</span>
    </div>
    <div class="stat-chip">
      <span class="label">Speed</span>
      <span class="value green" id="speed-display">0</span>
    </div>
    <div class="stat-chip">
      <span class="label">Heading</span>
      <span class="value" id="heading-display-chip">0°</span>
    </div>
    <div class="stat-chip">
      <span class="label">Battery</span>
      <span class="value warn" id="battery-display">--</span>
    </div>
  </div>

  <div id="main">
    <div id="visualizer">
      <canvas id="viz-canvas" width="180" height="180"></canvas>
    </div>

    <div id="controls-row">
      <button class="btn primary" id="btn-connect-sphero">⬡ Connect Sphero</button>
      <button class="btn secondary" id="btn-disconnect" disabled>✕ Disconnect</button>
    </div>

    <div id="params-section">
      <div class="param-group">
        <span class="param-label">Max Speed</span>
        <input type="range" id="speed-limit" min="0" max="255" value="150" />
        <span class="param-value" id="speed-limit-val">150</span>
      </div>
      <div class="param-group">
        <span class="param-label">Heading Offset</span>
        <input type="range" id="heading-offset" min="0" max="359" value="0" />
        <span class="param-value" id="heading-offset-val">0°</span>
      </div>
    </div>

    <div id="color-section">
      <div class="section-label">LED Color</div>
      <div id="color-presets"></div>
      <div id="custom-color-row">
        <input type="color" id="custom-color" value="#00f0ff" />
        <span id="custom-color-label">Custom color</span>
        <button class="btn" style="flex:0;padding:6px 10px;" id="btn-set-color">Set</button>
      </div>
    </div>

    <div id="action-row">
      <button class="btn" id="btn-calibrate">⊕ Aim</button>
      <button class="btn" id="btn-wake">↑ Wake</button>
      <button class="btn" id="btn-sleep">↓ Sleep</button>
      <button class="btn danger" id="estop">■ STOP</button>
    </div>

    <div id="log">
      <div class="log-line info">System ready. Connect Sphero via BLE.</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// SPHERO V2 BLE PROTOCOL
// ═══════════════════════════════════════════════════════════

const SPHERO_SERVICE   = '00010001-574f-4f20-5370-6865726f2121';
const SPHERO_API_V2_TX = '00010002-574f-4f20-5370-6865726f2121'; // Write commands
const SPHERO_API_V2_RX = '00010003-574f-4f20-5370-6865726f2121'; // Notify responses

// Packet framing
const SOP = 0x8D;
const EOP = 0xD8;
const ESC = 0xAB;
const ESC_SOP  = 0x05;
const ESC_EOP  = 0x50;
const ESC_ESC  = 0x23;

// Flags
const FLAG_IS_RESPONSE     = 0x01;
const FLAG_REQUEST_RESP    = 0x02;
const FLAG_RESET_TIMEOUT   = 0x04;
const FLAG_COMMAND_HAS_TID = 0x10;
const FLAG_COMMAND_HAS_SID = 0x20;

// Device IDs
const DID_API_PROCESSOR    = 0x10;
const DID_SYSTEM_INFO      = 0x11;
const DID_POWER            = 0x13;
const DID_DRIVING          = 0x16;
const DID_ANIMTRONICS      = 0x17;
const DID_SENSOR           = 0x18;
const DID_LED              = 0x1A;

// Command IDs
const CMD_WAKE             = 0x0D;
const CMD_SLEEP            = 0x01;
const CMD_GET_BATTERY      = 0x03;
const CMD_ROLL             = 0x07;
const CMD_STOP             = 0x00; // actually set speed 0
const CMD_RESET_HEADING    = 0x06;
const CMD_SET_LED_COLOR    = 0x0E;
const CMD_SET_ALL_LEDS     = 0x1A;
const CMD_ECHO             = 0x00; // api processor

// Source / Target IDs (Sphero Mini / SPRK+ / BOLT style)
const SRC_ID = 0x28; // our source
const TGT_MAIN = 0x11;
const TGT_NORDIC = 0x21; // some models use nordic chip

let seqNum = 0;

function buildPacket(did, cid, data = []) {
  const seq = (seqNum++) & 0xFF;
  const flags = FLAG_REQUEST_RESP | FLAG_RESET_TIMEOUT;
  // Header bytes (before checksum): flags, TID(absent), SID(absent), did, cid, seq, ...data
  const headerAndData = [flags, did, cid, seq, ...data];
  const chk = (~headerAndData.reduce((a, b) => (a + b) & 0xFF, 0)) & 0xFF;
  const raw = [flags, did, cid, seq, ...data, chk];
  return encode([SOP, ...raw, EOP]);
}

function encode(bytes) {
  const out = [];
  for (let i = 0; i < bytes.length; i++) {
    const b = bytes[i];
    if (i === 0 || i === bytes.length - 1) { out.push(b); continue; }
    if (b === SOP)      { out.push(ESC, ESC_SOP); }
    else if (b === EOP) { out.push(ESC, ESC_EOP); }
    else if (b === ESC) { out.push(ESC, ESC_ESC); }
    else                { out.push(b); }
  }
  return new Uint8Array(out);
}

// ═══════════════════════════════════════════════════════════
// BLE STATE
// ═══════════════════════════════════════════════════════════

let bleDevice   = null;
let bleServer   = null;
let txChar      = null; // write
let rxChar      = null; // notify

async function connectSphero() {
  log('Requesting BLE device...', 'info');
  updateSpheroStatus('connecting');

  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [
        { services: [SPHERO_SERVICE] },
        { namePrefix: 'Sphero' },
        { namePrefix: 'SK-' },
        { namePrefix: 'BB-' },
        { namePrefix: 'R2-' },
      ],
      optionalServices: [SPHERO_SERVICE]
    });

    bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
    log(`Device: ${bleDevice.name}`, 'info');

    bleServer = await bleDevice.gatt.connect();
    log('GATT connected', 'ok');

    const service = await bleServer.getPrimaryService(SPHERO_SERVICE);
    txChar = await service.getCharacteristic(SPHERO_API_V2_TX);
    rxChar = await service.getCharacteristic(SPHERO_API_V2_RX);

    await rxChar.startNotifications();
    rxChar.addEventListener('characteristicvaluechanged', onNotify);
    log('Notifications started', 'ok');

    updateSpheroStatus('connected');

    // Wake the device
    await sendPacket(buildPacket(DID_POWER, CMD_WAKE));
    log('Wake sent', 'ok');

    // Request battery
    setTimeout(() => sendPacket(buildPacket(DID_POWER, CMD_GET_BATTERY)), 800);

    // Set default color
    setTimeout(() => setLEDColor(0, 240, 255), 1000);

    toast('Sphero connected!');

  } catch (err) {
    log(`Connection failed: ${err.message}`, 'error');
    updateSpheroStatus('disconnected');
    bleDevice = null;
  }
}

function onDisconnected() {
  log('Sphero disconnected', 'warn');
  updateSpheroStatus('disconnected');
  txChar = null; rxChar = null; bleServer = null;
}

async function disconnectSphero() {
  if (bleDevice && bleDevice.gatt.connected) {
    try {
      await sendPacket(buildPacket(DID_POWER, CMD_SLEEP));
    } catch(e) {}
    bleDevice.gatt.disconnect();
  }
}

async function sendPacket(bytes) {
  if (!txChar) return;
  try {
    await txChar.writeValueWithoutResponse(bytes);
  } catch(e) {
    log(`Send error: ${e.message}`, 'error');
  }
}

function onNotify(event) {
  const data = new Uint8Array(event.target.value.buffer);
  parseResponse(data);
}

function parseResponse(data) {
  // Look for battery response (DID=0x13, CID=0x03)
  if (data.length > 5) {
    // Very simplified: look for power response bytes
    // data[1]=flags, data[2]=did, data[3]=cid
    const decoded = decode(data);
    if (decoded.length > 6 && decoded[3] === DID_POWER && decoded[4] === CMD_GET_BATTERY) {
      const state = decoded[7]; // battery state
      const states = ['Unknown','Charged','Charging','Not Charging','Low Charge'];
      document.getElementById('battery-display').textContent = states[state] || `State ${state}`;
    }
  }
}

function decode(bytes) {
  const out = [];
  for (let i = 0; i < bytes.length; i++) {
    if (bytes[i] === ESC) {
      i++;
      if (bytes[i] === ESC_SOP) out.push(SOP);
      else if (bytes[i] === ESC_EOP) out.push(EOP);
      else if (bytes[i] === ESC_ESC) out.push(ESC);
      else out.push(bytes[i]);
    } else {
      out.push(bytes[i]);
    }
  }
  return out;
}

// ═══════════════════════════════════════════════════════════
// DRIVE COMMANDS
// ═══════════════════════════════════════════════════════════

function toUint16BE(n) {
  return [(n >> 8) & 0xFF, n & 0xFF];
}

async function roll(speed, heading, reverse = false) {
  // Clamp & apply speed limit
  const maxSpd = parseInt(document.getElementById('speed-limit').value);
  const clampedSpeed = Math.min(Math.abs(speed), maxSpd);
  const h = ((heading + parseInt(document.getElementById('heading-offset').value)) % 360 + 360) % 360;
  const flags = reverse ? 0x02 : 0x01;
  const data = [clampedSpeed, ...toUint16BE(h), flags];
  await sendPacket(buildPacket(DID_DRIVING, CMD_ROLL, data));

  document.getElementById('speed-display').textContent = clampedSpeed;
  document.getElementById('heading-display-chip').textContent = `${h}°`;
  updateViz(clampedSpeed, h);
}

async function stopRoll() {
  await sendPacket(buildPacket(DID_DRIVING, CMD_ROLL, [0, 0, 0, 0x00]));
  document.getElementById('speed-display').textContent = '0';
  updateViz(0, lastHeading);
}

async function resetHeading() {
  await sendPacket(buildPacket(DID_DRIVING, CMD_RESET_HEADING));
  log('Heading reset to 0°', 'ok');
}

async function setLEDColor(r, g, b) {
  // Set main LED (index 0)
  await sendPacket(buildPacket(DID_LED, CMD_SET_LED_COLOR, [0x00, r, g, b]));
}

async function setAllLEDs(r, g, b) {
  // Try both set commands for compatibility
  await sendPacket(buildPacket(DID_LED, CMD_SET_LED_COLOR, [0x00, r, g, b]));
  // Some models: all LED mask
  const mask = [0x00, 0x00, 0x00, 0x0E]; // typical all-led bitmask
  await sendPacket(buildPacket(DID_LED, CMD_SET_ALL_LEDS, [...mask, r, g, b, r, g, b, r, g, b]));
}

// ═══════════════════════════════════════════════════════════
// GAMEPAD / CONTROLLER INPUT
// ═══════════════════════════════════════════════════════════

let gamepadIndex = null;
let lastHeading = 0;
let driveLoop = null;

window.addEventListener('gamepadconnected', (e) => {
  gamepadIndex = e.gamepad.index;
  document.getElementById('gamepad-dot').classList.add('active');
  document.getElementById('gamepad-label').textContent = e.gamepad.id.slice(0, 20);
  log(`Controller: ${e.gamepad.id.slice(0,30)}`, 'ok');
  toast('Controller connected!');
  if (!driveLoop) startDriveLoop();
});

window.addEventListener('gamepaddisconnected', (e) => {
  if (e.gamepad.index === gamepadIndex) {
    gamepadIndex = null;
    document.getElementById('gamepad-dot').classList.remove('active');
    document.getElementById('gamepad-label').textContent = 'No gamepad';
    log('Controller disconnected', 'warn');
    stopRoll();
  }
});

let prevButtons = {};
let frameCount = 0;

function startDriveLoop() {
  driveLoop = requestAnimationFrame(pollGamepad);
}

async function pollGamepad() {
  driveLoop = requestAnimationFrame(pollGamepad);

  if (gamepadIndex === null) return;

  const gp = navigator.getGamepads()[gamepadIndex];
  if (!gp || !txChar) return;

  frameCount++;
  // Only send drive commands every ~3 frames (~20Hz) to avoid flooding BLE
  const shouldSend = (frameCount % 3 === 0);

  // Left stick: axes 0 (X) and 1 (Y)
  const lx = applyDeadzone(gp.axes[0]);
  const ly = applyDeadzone(gp.axes[1]);
  // Right stick for heading-only mode
  const rx = applyDeadzone(gp.axes[2]);
  const ry = applyDeadzone(gp.axes[3]);

  // Calculate speed from left stick magnitude
  const magnitude = Math.min(1, Math.sqrt(lx * lx + ly * ly));
  const speed = Math.round(magnitude * 255);

  // Calculate heading from left stick angle (or right stick)
  let heading = lastHeading;
  if (magnitude > 0.1) {
    // atan2: 0=right → we want 0=up, clockwise
    const angle = Math.atan2(lx, -ly) * (180 / Math.PI);
    heading = ((angle % 360) + 360) % 360;
    lastHeading = heading;
  } else if (Math.sqrt(rx*rx+ry*ry) > 0.1) {
    // Right stick adjusts heading without moving
    const angle = Math.atan2(rx, -ry) * (180 / Math.PI);
    heading = ((angle % 360) + 360) % 360;
    lastHeading = heading;
  }

  if (shouldSend) {
    if (speed > 5) {
      await roll(speed, Math.round(heading));
    } else {
      await stopRoll();
    }
  }

  // Triggers: L2 (axis 4 or button 6) for boost
  // Button mappings (standard gamepad layout):
  // 0=A/Cross, 1=B/Circle, 2=X/Square, 3=Y/Triangle
  // 4=LB, 5=RB, 8=Select, 9=Start, 10=L3, 11=R3
  // 12=Up, 13=Down, 14=Left, 15=Right

  // D-pad manual control (alternative if no stick)
  const up    = gp.buttons[12]?.pressed;
  const down  = gp.buttons[13]?.pressed;
  const left  = gp.buttons[14]?.pressed;
  const right = gp.buttons[15]?.pressed;

  if ((up || down || left || right) && magnitude < 0.1 && shouldSend) {
    let dpadHeading = 0;
    let dpadSpeed = 150;
    if (up)    { dpadHeading = 0; }
    if (down)  { dpadHeading = 180; }
    if (left)  { dpadHeading = 270; }
    if (right) { dpadHeading = 90; }
    if (up && right)   dpadHeading = 45;
    if (up && left)    dpadHeading = 315;
    if (down && right) dpadHeading = 135;
    if (down && left)  dpadHeading = 225;
    await roll(dpadSpeed, dpadHeading);
  }

  // Button A (0) = E-STOP
  if (gp.buttons[0]?.pressed && !prevButtons[0]) {
    await stopRoll();
    log('E-STOP (A button)', 'warn');
  }

  // Button B (1) = Reset heading
  if (gp.buttons[1]?.pressed && !prevButtons[1]) {
    await resetHeading();
  }

  // Button X (2) = LED cycle
  if (gp.buttons[2]?.pressed && !prevButtons[2]) {
    cycleColor();
  }

  // Button Y (3) = Boost
  if (gp.buttons[3]?.pressed && shouldSend) {
    if (magnitude > 0.1) {
      await roll(255, Math.round(heading));
    }
  }

  // RB (5) = Wake
  if (gp.buttons[5]?.pressed && !prevButtons[5]) {
    await sendPacket(buildPacket(DID_POWER, CMD_WAKE));
    log('Wake sent', 'ok');
  }

  // Store previous state
  for (let i = 0; i < gp.buttons.length; i++) {
    prevButtons[i] = gp.buttons[i]?.pressed;
  }

  // Update viz regardless of send throttle
  updateViz(speed, Math.round(heading));
}

function applyDeadzone(val, dz = 0.12) {
  if (Math.abs(val) < dz) return 0;
  return (val - Math.sign(val) * dz) / (1 - dz);
}

// ═══════════════════════════════════════════════════════════
// VISUALIZER
// ═══════════════════════════════════════════════════════════

const canvas = document.getElementById('viz-canvas');
const ctx = canvas.getContext('2d');
let vizHeading = 0;
let vizSpeed = 0;
let vizAnimFrame = null;

function updateViz(speed, heading) {
  vizSpeed = speed;
  vizHeading = heading;
  if (!vizAnimFrame) vizAnimFrame = requestAnimationFrame(drawViz);
}

function drawViz() {
  vizAnimFrame = null;
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const r = Math.min(cx, cy) - 4;

  ctx.clearRect(0, 0, w, h);

  // Background gradient
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  bg.addColorStop(0, '#0d0d25');
  bg.addColorStop(1, '#080812');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Grid rings
  ctx.strokeStyle = 'rgba(30,30,70,0.8)';
  ctx.lineWidth = 1;
  for (let ri = 1; ri <= 3; ri++) {
    ctx.beginPath();
    ctx.arc(cx, cy, r * ri / 3, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Cross hairs
  ctx.strokeStyle = 'rgba(30,30,70,0.6)';
  ctx.beginPath();
  ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
  ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
  ctx.stroke();

  // Cardinal labels
  ctx.fillStyle = 'rgba(74,90,106,0.9)';
  ctx.font = '9px Share Tech Mono';
  ctx.textAlign = 'center';
  ctx.fillText('N', cx, cy - r + 12);
  ctx.fillText('S', cx, cy + r - 4);
  ctx.textAlign = 'left';
  ctx.fillText('E', cx + r - 10, cy + 4);
  ctx.textAlign = 'right';
  ctx.fillText('W', cx - r + 10, cy + 4);
  ctx.textAlign = 'center';

  // Speed ring fill
  if (vizSpeed > 0) {
    const speedR = (vizSpeed / 255) * r * 0.85;
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, speedR);
    grd.addColorStop(0, 'rgba(0,240,255,0.07)');
    grd.addColorStop(1, 'rgba(0,240,255,0.02)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(cx, cy, speedR, 0, Math.PI * 2);
    ctx.fill();
  }

  // Heading arrow
  const headRad = (vizHeading - 90) * Math.PI / 180;
  const arrowLen = vizSpeed > 5 ? r * 0.7 * (vizSpeed / 255 + 0.3) : r * 0.35;

  const tx = cx + Math.cos(headRad) * arrowLen;
  const ty = cy + Math.sin(headRad) * arrowLen;

  // Arrow glow trail
  if (vizSpeed > 0) {
    ctx.strokeStyle = 'rgba(0,240,255,0.2)';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx, ty);
    ctx.stroke();
  }

  // Arrow
  ctx.strokeStyle = vizSpeed > 5 ? '#00f0ff' : 'rgba(0,240,255,0.5)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = vizSpeed > 5 ? 10 : 4;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(tx, ty);
  ctx.stroke();

  // Arrowhead
  const ah = 10, aw = 5;
  ctx.fillStyle = vizSpeed > 5 ? '#00f0ff' : 'rgba(0,240,255,0.5)';
  ctx.beginPath();
  const perpRad = headRad + Math.PI / 2;
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx - ah * Math.cos(headRad) + aw * Math.cos(perpRad),
             ty - ah * Math.sin(headRad) + aw * Math.sin(perpRad));
  ctx.lineTo(tx - ah * Math.cos(headRad) - aw * Math.cos(perpRad),
             ty - ah * Math.sin(headRad) - aw * Math.sin(perpRad));
  ctx.closePath();
  ctx.fill();

  // Center dot
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#7b2fff';
  ctx.shadowColor = '#7b2fff';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Heading text on canvas
  ctx.fillStyle = '#00f0ff';
  ctx.font = 'bold 13px Orbitron';
  ctx.fillText(`${vizHeading}°`, cx, cy + r - 14);
}

drawViz(); // initial draw

// ═══════════════════════════════════════════════════════════
// COLORS
// ═══════════════════════════════════════════════════════════

const COLOR_PRESETS = [
  { r: 0,   g: 240, b: 255, hex: '#00f0ff' }, // cyan
  { r: 123, g: 47,  b: 255, hex: '#7b2fff' }, // purple
  { r: 255, g: 47,  b: 110, hex: '#ff2f6e' }, // pink
  { r: 0,   g: 255, b: 136, hex: '#00ff88' }, // green
  { r: 255, g: 170, b: 0,   hex: '#ffaa00' }, // orange
  { r: 255, g: 255, b: 255, hex: '#ffffff' }, // white
  { r: 255, g: 0,   b: 0,   hex: '#ff0000' }, // red
  { r: 0,   g: 0,   b: 255, hex: '#0000ff' }, // blue
];

let activeColorIdx = 0;

function buildColorPresets() {
  const container = document.getElementById('color-presets');
  COLOR_PRESETS.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (i === 0 ? ' active' : '');
    sw.style.background = c.hex;
    sw.title = c.hex;
    sw.addEventListener('click', () => {
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      activeColorIdx = i;
      setAllLEDs(c.r, c.g, c.b);
      log(`Color set: ${c.hex}`, 'ok');
    });
    container.appendChild(sw);
  });
}

function cycleColor() {
  activeColorIdx = (activeColorIdx + 1) % COLOR_PRESETS.length;
  const c = COLOR_PRESETS[activeColorIdx];
  document.querySelectorAll('.color-swatch').forEach((s, i) => {
    s.classList.toggle('active', i === activeColorIdx);
  });
  setAllLEDs(c.r, c.g, c.b);
}

// ═══════════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════════

function updateSpheroStatus(state) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('sphero-status');
  const btnConn = document.getElementById('btn-connect-sphero');
  const btnDisc = document.getElementById('btn-disconnect');

  dot.className = state === 'connected' ? 'connected' : state === 'connecting' ? 'connecting' : '';
  if (state === 'connected') {
    txt.textContent = 'Connected';
    txt.className = 'value green';
    btnConn.disabled = true;
    btnDisc.disabled = false;
  } else if (state === 'connecting') {
    txt.textContent = 'Connecting…';
    txt.className = 'value warn';
    btnConn.disabled = true;
    btnDisc.disabled = true;
  } else {
    txt.textContent = 'Disconnected';
    txt.className = 'value red';
    btnConn.disabled = false;
    btnDisc.disabled = true;
  }
}

const logEl = document.getElementById('log');
function log(msg, type = 'log') {
  const line = document.createElement('div');
  line.className = `log-line ${type}`;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  // Keep max 50 lines
  while (logEl.children.length > 50) logEl.removeChild(logEl.firstChild);
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════════════════════
// BUTTON WIRING
// ═══════════════════════════════════════════════════════════

document.getElementById('btn-connect-sphero').addEventListener('click', () => {
  if (!navigator.bluetooth) {
    log('Web Bluetooth not supported. Use Chrome on Android.', 'error');
    toast('Need Chrome on Android for BLE');
    return;
  }
  connectSphero();
});

document.getElementById('btn-disconnect').addEventListener('click', disconnectSphero);

document.getElementById('btn-calibrate').addEventListener('click', async () => {
  await resetHeading();
  toast('Heading reset!');
});

document.getElementById('btn-wake').addEventListener('click', async () => {
  await sendPacket(buildPacket(DID_POWER, CMD_WAKE));
  log('Wake sent', 'ok');
});

document.getElementById('btn-sleep').addEventListener('click', async () => {
  await sendPacket(buildPacket(DID_POWER, CMD_SLEEP));
  log('Sleep sent', 'ok');
});

document.getElementById('estop').addEventListener('click', async () => {
  await stopRoll();
  toast('STOP!');
});

document.getElementById('btn-set-color').addEventListener('click', () => {
  const hex = document.getElementById('custom-color').value;
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  setAllLEDs(r, g, b);
  log(`Custom color: ${hex}`, 'ok');
});

document.getElementById('speed-limit').addEventListener('input', (e) => {
  document.getElementById('speed-limit-val').textContent = e.target.value;
});

document.getElementById('heading-offset').addEventListener('input', (e) => {
  document.getElementById('heading-offset-val').textContent = `${e.target.value}°`;
});

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════

buildColorPresets();
startDriveLoop();

// Check for Web Bluetooth support
if (!navigator.bluetooth) {
  log('Web Bluetooth NOT available. Open in Chrome on Android.', 'error');
  document.getElementById('btn-connect-sphero').disabled = true;
}

// Service worker registration for PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => log('PWA service worker registered', 'info'))
    .catch(e => log(`SW error: ${e.message}`, 'warn'));
}
</script>
