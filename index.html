<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sphero Control" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <title>Sphero Control</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: #0f0f1a;
      --panel2: #141428;
      --border: #1e1e3f;
      --accent: #00f0ff;
      --accent2: #7b2fff;
      --accent3: #ff2f6e;
      --green: #00ff88;
      --warn: #ffaa00;
      --text: #c8d8e8;
      --dim: #4a5a6a;
      --glow: 0 0 12px var(--accent), 0 0 24px rgba(0,240,255,0.3);
      --glow2: 0 0 12px var(--accent2), 0 0 24px rgba(123,47,255,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
      pointer-events: none;
      z-index: 1000;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 10px;
      gap: 8px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-shadow: var(--glow);
    }
    h1 span { color: var(--accent2); }
    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--dim);
      transition: background 0.3s, box-shadow 0.3s;
    }
    #status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
    #status-dot.connecting { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    #status-bar { display: flex; gap: 6px; flex-wrap: wrap; }
    .stat-chip {
      flex: 1; min-width: 80px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px;
      font-size: 0.7rem; letter-spacing: 0.05em;
      display: flex; flex-direction: column; gap: 2px;
    }
    .stat-chip .label { color: var(--dim); font-size: 0.65rem; text-transform: uppercase; }
    .stat-chip .value { color: var(--accent); font-size: 0.85rem; }
    .stat-chip .value.green { color: var(--green); }
    .stat-chip .value.warn { color: var(--warn); }
    .stat-chip .value.red { color: var(--accent3); }
    #main { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
    #visualizer {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px;
      display: flex; flex-direction: column; gap: 8px; align-items: center;
    }
    #viz-canvas {
      width: 180px; height: 180px;
      border-radius: 50%; border: 2px solid var(--border);
      background: radial-gradient(circle at 50% 50%, #0d0d20, #08080f);
    }
    #controls-row { display: flex; gap: 8px; }
    .btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 14px; background: var(--panel2); color: var(--text);
      cursor: pointer; transition: all 0.15s; flex: 1;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.96); }
    .btn.primary { border-color: var(--accent); color: var(--accent); }
    .btn.primary:hover { background: rgba(0,240,255,0.08); box-shadow: var(--glow); }
    .btn.secondary { border-color: var(--accent2); color: var(--accent2); }
    .btn.secondary:hover { background: rgba(123,47,255,0.08); box-shadow: var(--glow2); }
    .btn.danger { border-color: var(--accent3); color: var(--accent3); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #color-section {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px;
    }
    .section-label { font-size: 0.65rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    #color-presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .color-swatch {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .color-swatch:active { transform: scale(0.85); }
    .color-swatch.active { border-color: white; transform: scale(1.15); }
    #custom-color-row { display: flex; align-items: center; gap: 8px; }
    input[type="color"] {
      width: 40px; height: 32px; border: 1px solid var(--border);
      border-radius: 4px; background: none; cursor: pointer; padding: 2px;
    }
    #custom-color-label { font-size: 0.7rem; color: var(--dim); }
    #params-section {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; display: flex; gap: 10px;
    }
    .param-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .param-label { font-size: 0.65rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 4px;
      border-radius: 2px; background: var(--border); outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 6px var(--accent); cursor: pointer;
    }
    .param-value { font-size: 0.75rem; color: var(--accent); text-align: right; }
    #log {
      flex: 1; background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; overflow-y: auto;
      font-size: 0.68rem; line-height: 1.6; min-height: 60px; max-height: 120px;
    }
    .log-line { color: var(--dim); }
    .log-line.info { color: var(--text); }
    .log-line.ok { color: var(--green); }
    .log-line.error { color: var(--accent3); }
    .log-line.warn { color: var(--warn); }
    .log-line::before { content: '> '; color: var(--accent2); }
    #gamepad-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.68rem; color: var(--dim); }
    #gamepad-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    #gamepad-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #action-row { display: flex; gap: 6px; }
    #estop {
      background: var(--accent3); color: #000; font-weight: 700;
      border-color: var(--accent3); font-family: 'Orbitron', sans-serif; letter-spacing: 0.1em;
    }
    #estop:active { background: #ff0044; }
    #toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--panel2); border: 1px solid var(--accent);
      color: var(--accent); padding: 8px 18px; border-radius: 20px;
      font-size: 0.75rem; letter-spacing: 0.08em;
      transition: transform 0.25s; z-index: 999;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    #version-badge {
      position: fixed;
      bottom: 6px;
      left: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      color: var(--dim);
      letter-spacing: 0.05em;
      pointer-events: none;
      z-index: 998;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>SPHERO<span>CTRL</span></h1>
    <div id="gamepad-indicator">
      <div id="gamepad-dot"></div>
      <span id="gamepad-label">No gamepad</span>
    </div>
    <div id="status-dot"></div>
  </header>

  <div id="status-bar">
    <div class="stat-chip">
      <span class="label">Sphero</span>
      <span class="value red" id="sphero-status">Disconnected</span>
    </div>
    <div class="stat-chip">
      <span class="label">Speed</span>
      <span class="value green" id="speed-display">0</span>
    </div>
    <div class="stat-chip">
      <span class="label">Heading</span>
      <span class="value" id="heading-display-chip">0°</span>
    </div>
    <div class="stat-chip">
      <span class="label">Battery</span>
      <span class="value warn" id="battery-display">--</span>
    </div>
  </div>

  <div id="main">
    <div id="visualizer">
      <canvas id="viz-canvas" width="180" height="180"></canvas>
    </div>

    <div id="controls-row">
      <button class="btn primary" id="btn-connect-sphero">⬡ Connect Sphero</button>
      <button class="btn secondary" id="btn-disconnect" disabled>✕ Disconnect</button>
    </div>

    <div id="params-section">
      <div class="param-group">
        <span class="param-label">Max Speed</span>
        <input type="range" id="speed-limit" min="0" max="255" value="150" />
        <span class="param-value" id="speed-limit-val">150</span>
      </div>
      <div class="param-group">
        <span class="param-label">Heading Offset</span>
        <input type="range" id="heading-offset" min="0" max="359" value="0" />
        <span class="param-value" id="heading-offset-val">0°</span>
      </div>
    </div>

    <div id="color-section">
      <div class="section-label">LED Color</div>
      <div id="color-presets"></div>
      <div id="custom-color-row">
        <input type="color" id="custom-color" value="#00f0ff" />
        <span id="custom-color-label">Custom color</span>
        <button class="btn" style="flex:0;padding:6px 10px;" id="btn-set-color">Set</button>
      </div>
    </div>

    <div id="action-row">
      <button class="btn" id="btn-calibrate">⊕ Aim</button>
      <button class="btn" id="btn-wake">↑ Wake</button>
      <button class="btn" id="btn-sleep">↓ Sleep</button>
      <button class="btn danger" id="estop">■ STOP</button>
    </div>

    <div id="log">
      <div class="log-line info">System ready. Connect Sphero via BLE.</div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="version-badge">v0.5</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// SPHERO V2 BLE PROTOCOL — Correct UUIDs for Mini / BOLT / BB-8 / R2D2 etc.
//
// The Sphero V2 API uses TWO services:
//   1. Init service  (00020001-…): write "usetheforce...band" to anti-DOS char
//      then write wake packet to the init command char
//   2. Main service  (00010001-…): all further commands go here
//
// Without the init handshake the Mini will accept the GATT connection
// but ignore every command packet — this was the bug in v1.
// ═══════════════════════════════════════════════════════════════════════════

// --- Service / characteristic UUIDs (128-bit, dashes inserted) ---
const INIT_SVC          = '00020001-574f-4f20-5370-6865726f2121';
const INIT_ANTIDOS_CHAR = '00020005-574f-4f20-5370-6865726f2121'; // write "usetheforce...band"
const INIT_DFU_CHAR     = '00020002-574f-4f20-5370-6865726f2121'; // enable notify — KEEPS MINI ALIVE
const INIT_CMD_CHAR     = '00020003-574f-4f20-5370-6865726f2121'; // write initial wake packet

const MAIN_SVC          = '00010001-574f-4f20-5370-6865726f2121';
const MAIN_CMD_CHAR     = '00010002-574f-4f20-5370-6865726f2121'; // write commands
const MAIN_RSP_CHAR     = '00010003-574f-4f20-5370-6865726f2121'; // notify responses

// Anti-DOS key: ASCII "usetheforce...band"
const ANTIDOS_KEY = new Uint8Array([
  0x75,0x73,0x65,0x74,0x68,0x65,0x66,0x6f,
  0x72,0x63,0x65,0x2e,0x2e,0x2e,0x62,0x61,0x6e,0x64
]);

// --- Packet framing ---
const SOP = 0x8D;
const EOP = 0xD8;
const ESC = 0xAB;
const ESC_SOP = 0x05;
const ESC_EOP = 0x50;
const ESC_ESC = 0x23;

// --- Flags ---
const FLAG_REQUEST_RESP  = 0x02;
const FLAG_RESET_TIMEOUT = 0x04;

// --- Device & Command IDs ---
const DID_POWER   = 0x13;
const DID_DRIVING = 0x16;
const DID_LED     = 0x1A;

const CMD_WAKE          = 0x0D;
const CMD_SLEEP         = 0x01;
const CMD_GET_BATTERY   = 0x03;
const CMD_ROLL          = 0x07;
const CMD_RESET_HEADING = 0x06;
const CMD_SET_LED       = 0x0E;   // set LEDs with mapping (mask + RGB)

let seqNum = 0;

function buildPacket(did, cid, data = []) {
  const seq = (seqNum++) & 0xFF;
  const flags = FLAG_REQUEST_RESP | FLAG_RESET_TIMEOUT;
  const inner = [flags, did, cid, seq, ...data];
  const chk = (~inner.reduce((a, b) => (a + b) & 0xFF, 0)) & 0xFF;
  const raw = [...inner, chk];
  // Encode: SOP + escaped inner bytes + EOP
  const out = [SOP];
  for (const b of raw) {
    if (b === SOP)      { out.push(ESC, ESC_SOP); }
    else if (b === EOP) { out.push(ESC, ESC_EOP); }
    else if (b === ESC) { out.push(ESC, ESC_ESC); }
    else                { out.push(b); }
  }
  out.push(EOP);
  return new Uint8Array(out);
}

function toUint16BE(n) { return [(n >> 8) & 0xFF, n & 0xFF]; }

// ═══════════════════════════════════════════════════════════════════════════
// BLE STATE
// ═══════════════════════════════════════════════════════════════════════════

let bleDevice  = null;
let bleServer  = null;
let cmdChar    = null;
let rspChar    = null;
let handshaking = false;

async function connectSphero() {
  if (!navigator.bluetooth) {
    log('Web Bluetooth not supported. Use Chrome on Android.', 'error');
    return;
  }
  log('Opening BLE device picker…', 'info');
  updateSpheroStatus('connecting');

  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [
        { services: [MAIN_SVC] },
        { services: [INIT_SVC] },
        { namePrefix: 'SM-' },
        { namePrefix: 'Sphero' },
        { namePrefix: 'SK-' },
        { namePrefix: 'BB-' },
        { namePrefix: 'R2-' },
      ],
      optionalServices: [MAIN_SVC, INIT_SVC]
    });

    log(`Device: ${bleDevice.name || '(unnamed)'}`, 'info');
    bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
    await doConnect();

  } catch (err) {
    if (err.name === 'NotFoundError' || err.name === 'AbortError') {
      log('No device selected.', 'warn');
    } else {
      log(`Connection failed: ${err.message}`, 'error');
    }
    updateSpheroStatus('disconnected');
    bleDevice = null; bleServer = null; cmdChar = null; rspChar = null;
    handshaking = false;
  }
}

async function doConnect() {
  handshaking = true;
  cmdChar = null; rspChar = null;

  log('Connecting GATT…', 'info');
  bleServer = await bleDevice.gatt.connect();
  log('GATT connected', 'ok');

  // ── Step 1: Init handshake (Sphero Mini specific) ─────────────────────
  //
  // Reverse-engineered from HCI sniffs (MProx/Sphero_mini, astagi/freer2d2).
  // The exact sequence the Sphero Edu app performs on connection is:
  //
  //   a) Write "usetheforce...band" to ANTIDOS char (00020005) — unlocks device
  //   b) Enable notifications on DFU char (00020002) by writing [0x01,0x00]
  //      to its CCCD descriptor — THIS is what keeps the Mini alive.
  //      Without it the Mini disconnects ~3 seconds after connecting.
  //   c) Write the raw legacy wake packet to INIT_CMD char (00020003)
  //
  // Steps (b) is the one that was missing in previous versions.

  log('Init handshake…', 'info');
  let initSvc = null;
  try {
    initSvc = await bleServer.getPrimaryService(INIT_SVC);
    log('Init service found', 'ok');
  } catch(e) {
    log('No init service — skipping (older firmware)', 'warn');
  }

  if (initSvc) {
    // (a) Anti-DOS key
    try {
      const antiDos = await initSvc.getCharacteristic(INIT_ANTIDOS_CHAR);
      await antiDos.writeValue(ANTIDOS_KEY);
      log('Anti-DOS key sent ✓', 'ok');
    } catch(e) {
      log(`Anti-DOS failed: ${e.message}`, 'error');
      throw e;
    }

    await delay(100);

    // (b) Enable DFU notifications — critical to prevent 3s disconnect
    try {
      const dfuChar = await initSvc.getCharacteristic(INIT_DFU_CHAR);
      // startNotifications() handles writing the CCCD [0x01,0x00] for us
      await dfuChar.startNotifications();
      log('DFU notify enabled ✓', 'ok');
    } catch(e) {
      log(`DFU notify failed: ${e.message}`, 'warn');
      // Try writing CCCD manually as a fallback
      try {
        const dfuChar = await initSvc.getCharacteristic(INIT_DFU_CHAR);
        const cccd = await dfuChar.getDescriptor(0x2902);
        await cccd.writeValue(new Uint8Array([0x01, 0x00]));
        log('DFU CCCD written manually ✓', 'ok');
      } catch(e2) {
        log(`DFU CCCD fallback failed: ${e2.message}`, 'warn');
      }
    }

    await delay(100);

    // (c) Raw wake on init cmd char
    // Raw legacy packet: SOP=0x8D, flags=0x0A, DID=0x13, CID=0x0D, SEQ=0x00, CHK=0xD5, EOP=0xD8
    const RAW_WAKE = new Uint8Array([0x8D, 0x0A, 0x13, 0x0D, 0x00, 0xD5, 0xD8]);
    try {
      const initCmd = await initSvc.getCharacteristic(INIT_CMD_CHAR);
      await initCmd.writeValue(RAW_WAKE);
      log('Init wake sent ✓', 'ok');
    } catch(e) {
      log(`Init cmd N/A: ${e.message}`, 'warn');
    }
  }

  // Wait for Mini to settle post-handshake, reconnect if it briefly drops
  await delay(600);
  if (!bleDevice.gatt.connected) {
    log('Reconnecting after handshake drop…', 'warn');
    bleServer = await bleDevice.gatt.connect();
    await delay(300);
  }

  // ── Step 2: Main service ──────────────────────────────────────────────
  log('Opening main service…', 'info');
  const mainSvc = await bleServer.getPrimaryService(MAIN_SVC);
  cmdChar = await mainSvc.getCharacteristic(MAIN_CMD_CHAR);
  rspChar = await mainSvc.getCharacteristic(MAIN_RSP_CHAR);

  await rspChar.startNotifications();
  rspChar.addEventListener('characteristicvaluechanged', onNotify);
  log('Main service ready ✓', 'ok');

  handshaking = false;
  updateSpheroStatus('connected');

  // ── Step 3: Post-connect commands ────────────────────────────────────
  await delay(200);
  await sendPacket(buildPacket(DID_POWER, CMD_WAKE));
  log('Wake sent ✓', 'ok');

  await delay(600);
  await sendPacket(buildPacket(DID_POWER, CMD_GET_BATTERY));

  await delay(200);
  await setAllLEDs(0, 240, 255);
  log('LED set to cyan ✓', 'ok');

  toast(`${bleDevice.name || 'Sphero'} connected!`);
}

function onDisconnected() {
  if (handshaking) {
    log('Link drop during handshake — normal for Mini, continuing…', 'warn');
    return;
  }
  log('Sphero disconnected', 'warn');
  updateSpheroStatus('disconnected');
  cmdChar = null; rspChar = null; bleServer = null;
}

async function disconnectSphero() {
  if (bleDevice && bleDevice.gatt.connected) {
    try { await sendPacket(buildPacket(DID_POWER, CMD_SLEEP)); } catch(e) {}
    await delay(200);
    bleDevice.gatt.disconnect();
  }
}

async function sendPacket(bytes) {
  if (!cmdChar) return;
  try {
    await cmdChar.writeValueWithoutResponse(bytes);
  } catch(e) {
    // Fall back to writeValue if writeValueWithoutResponse not supported
    try { await cmdChar.writeValue(bytes); }
    catch(e2) { log(`Send error: ${e2.message}`, 'error'); }
  }
}

function onNotify(event) {
  const data = new Uint8Array(event.target.value.buffer);
  parseBatteryResponse(data);
}

function parseBatteryResponse(data) {
  // Decode SLIP and look for a power response
  const dec = [];
  for (let i = 0; i < data.length; i++) {
    if (data[i] === ESC) { i++; dec.push(data[i] === ESC_SOP ? SOP : data[i] === ESC_EOP ? EOP : ESC); }
    else { dec.push(data[i]); }
  }
  // Byte layout after decode: SOP, flags, DID, CID, SEQ, [data...], CHK, EOP
  if (dec.length >= 8 && dec[0] === SOP) {
    const did = dec[2], cid = dec[3];
    if (did === DID_POWER && cid === CMD_GET_BATTERY && dec.length > 7) {
      const state = dec[6];
      const labels = ['Unknown','Charged','Charging','Not Charging','Low'];
      const el = document.getElementById('battery-display');
      el.textContent = labels[state] || `St:${state}`;
      el.className = 'value ' + (state === 1 ? 'green' : state === 4 ? 'red' : 'warn');
    }
  }
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════════════════════════════════════════════════════════════════════════
// DRIVE COMMANDS
// ═══════════════════════════════════════════════════════════════════════════

// headingOffset is the pilot's calibrated "forward" direction.
// In aim mode, right stick rotates it live; outside aim mode, right stick
// adds a steering component to left-stick heading.
let lastHeading  = 0;
let headingOffset = 0;
let aimMode = false;

async function roll(speed, heading) {
  const maxSpd = parseInt(document.getElementById('speed-limit').value);
  let s = Math.min(Math.abs(Math.round(speed)), maxSpd);
  // Sphero Mini stalls below ~85. Remap: any non-zero input → [85, maxSpd].
  if (s > 0) s = Math.round(85 + (s / 255) * (maxSpd - 85));
  s = Math.min(s, 255);
  const h = ((heading + headingOffset) % 360 + 360) % 360;
  const data = [s, ...toUint16BE(h), 0x01];
  await sendPacket(buildPacket(DID_DRIVING, CMD_ROLL, data));
  document.getElementById('speed-display').textContent = s;
  document.getElementById('heading-display-chip').textContent = `${h}°`;
  updateViz(s, h);
}

async function stopRoll() {
  const h = ((lastHeading + headingOffset) % 360 + 360) % 360;
  await sendPacket(buildPacket(DID_DRIVING, CMD_ROLL, [0, ...toUint16BE(h), 0x00]));
  document.getElementById('speed-display').textContent = '0';
  updateViz(0, lastHeading);
}

async function resetHeading() {
  // Reset the robot's internal yaw reference to current orientation
  await sendPacket(buildPacket(DID_DRIVING, CMD_RESET_HEADING));
  headingOffset = 0;
  lastHeading = 0;
  document.getElementById('heading-offset').value = 0;
  document.getElementById('heading-offset-val').textContent = '0°';
  document.getElementById('heading-display-chip').textContent = '0°';
  updateViz(0, 0);
  log('Heading reset ✓', 'ok');
}

async function setAllLEDs(r, g, b) {
  if (!cmdChar) return;
  // Sphero Mini LED command: DID=0x1A (userIO), CID=0x0E (setLEDsWithMapping)
  // Payload: [0x00, 0x00, 0x00, mask, R, G, B]
  // mask 0x07 = front RGB LED (channels 0,1,2)
  await sendPacket(buildPacket(DID_LED, CMD_SET_LED, [0x00, 0x00, 0x00, 0x07, r, g, b]));
}

async function setAimLED(brightness) {
  if (!cmdChar) return;
  // mask 0x01 = back (aiming) LED, single channel
  await sendPacket(buildPacket(DID_LED, CMD_SET_LED, [0x00, 0x00, 0x00, 0x01, brightness]));
}

// ═══════════════════════════════════════════════════════════════════════════
// GAMEPAD INPUT
// ═══════════════════════════════════════════════════════════════════════════

let gamepadIndex = null;
let driveLoop    = null;
let frameCount   = 0;
let prevButtons  = {};

window.addEventListener('gamepadconnected', (e) => {
  gamepadIndex = e.gamepad.index;
  document.getElementById('gamepad-dot').classList.add('active');
  document.getElementById('gamepad-label').textContent = e.gamepad.id.slice(0, 22);
  log(`Controller: ${e.gamepad.id.slice(0, 40)}`, 'ok');
  toast('Controller connected!');
  if (!driveLoop) driveLoop = requestAnimationFrame(pollGamepad);
});

window.addEventListener('gamepaddisconnected', (e) => {
  if (e.gamepad.index === gamepadIndex) {
    gamepadIndex = null;
    document.getElementById('gamepad-dot').classList.remove('active');
    document.getElementById('gamepad-label').textContent = 'No gamepad';
    log('Controller disconnected', 'warn');
    if (cmdChar) stopRoll();
  }
});

async function pollGamepad() {
  driveLoop = requestAnimationFrame(pollGamepad);
  if (gamepadIndex === null) return;
  const gp = navigator.getGamepads()[gamepadIndex];
  if (!gp || !cmdChar) return;

  frameCount++;
  const shouldSend = (frameCount % 3 === 0); // ~20 Hz

  const lx = applyDeadzone(gp.axes[0]);
  const ly = applyDeadzone(gp.axes[1]);
  const rx = applyDeadzone(gp.axes[2] ?? 0);
  const ry = applyDeadzone(gp.axes[3] ?? 0);
  const rMag = Math.sqrt(rx*rx + ry*ry);

  // ── B/Circle (1) = Toggle aim mode ──────────────────────────────────
  if (gp.buttons[1]?.pressed && !prevButtons[1]) {
    aimMode = !aimMode;
    if (aimMode) {
      // Enter aim mode: stop moving, turn on white back LED
      await stopRoll();
      await setAimLED(255);
      updateAimButton(true);
      log('Aim mode ON — rotate right stick to aim', 'info');
      toast('Aim mode ON');
    } else {
      // Exit aim mode: turn off back LED, commit offset
      await setAimLED(0);
      updateAimButton(false);
      log(`Aim mode OFF — offset: ${headingOffset}°`, 'ok');
      toast(`Aim set: ${headingOffset}°`);
    }
  }

  if (aimMode) {
    // In aim mode: right stick rotates headingOffset, left stick disabled
    if (rMag > 0.1 && shouldSend) {
      const aimAngle = (Math.atan2(rx, -ry) * 180 / Math.PI + 360) % 360;
      headingOffset = Math.round(aimAngle);
      document.getElementById('heading-offset').value = headingOffset;
      document.getElementById('heading-offset-val').textContent = `${headingOffset}°`;
      document.getElementById('heading-display-chip').textContent = `${headingOffset}°`;
      updateViz(0, headingOffset);
    }
    // Store buttons and skip driving
    for (let i = 0; i < gp.buttons.length; i++) prevButtons[i] = gp.buttons[i]?.pressed;
    return;
  }

  // ── Normal drive mode ────────────────────────────────────────────────
  const mag = Math.min(1, Math.sqrt(lx*lx + ly*ly));
  const speed = mag * 255;

  let heading = lastHeading;
  if (mag > 0.1) {
    // Left stick sets direction
    heading = (Math.atan2(lx, -ly) * 180 / Math.PI + 360) % 360;
    // Right stick adds rotation bias when both are active
    if (rMag > 0.15) {
      const rightAngle = (Math.atan2(rx, -ry) * 180 / Math.PI + 360) % 360;
      // Blend: mostly left stick direction, right stick nudges it
      const blend = rMag * 0.4;
      const diff = ((rightAngle - heading + 540) % 360) - 180;
      heading = (heading + diff * blend + 360) % 360;
    }
    lastHeading = heading;
  }

  if (shouldSend) {
    if (speed > 5) { await roll(speed, Math.round(heading)); }
    else           { await stopRoll(); }
  }

  // D-pad fallback
  const up    = gp.buttons[12]?.pressed;
  const down  = gp.buttons[13]?.pressed;
  const left  = gp.buttons[14]?.pressed;
  const right = gp.buttons[15]?.pressed;

  if ((up||down||left||right) && mag < 0.1 && shouldSend) {
    let dh = 0;
    if (up)              dh = 0;
    if (down)            dh = 180;
    if (left)            dh = 270;
    if (right)           dh = 90;
    if (up && right)     dh = 45;
    if (up && left)      dh = 315;
    if (down && right)   dh = 135;
    if (down && left)    dh = 225;
    lastHeading = dh;
    await roll(150, dh);
  }

  // A/Cross (0) = E-STOP
  if (gp.buttons[0]?.pressed && !prevButtons[0]) {
    await stopRoll(); log('E-STOP (A)', 'warn');
  }
  // X/Square (2) = Cycle LED
  if (gp.buttons[2]?.pressed && !prevButtons[2]) {
    cycleColor();
  }
  // Y/Triangle (3) held = Boost
  if (gp.buttons[3]?.pressed && mag > 0.1 && shouldSend) {
    await roll(255, Math.round(heading));
  }
  // RB/R1 (5) = Wake
  if (gp.buttons[5]?.pressed && !prevButtons[5]) {
    await sendPacket(buildPacket(DID_POWER, CMD_WAKE));
    log('Wake sent', 'ok');
  }

  for (let i = 0; i < gp.buttons.length; i++) prevButtons[i] = gp.buttons[i]?.pressed;
  updateViz(speed, Math.round(heading));
}

function applyDeadzone(val, dz = 0.12) {
  if (Math.abs(val) < dz) return 0;
  return (val - Math.sign(val) * dz) / (1 - dz);
}

// ═══════════════════════════════════════════════════════════════════════════
// VISUALIZER
// ═══════════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('viz-canvas');
const ctx    = canvas.getContext('2d');
let vizSpeed = 0, vizHeading = 0, vizFrame = null;

function updateViz(speed, heading) {
  vizSpeed = speed; vizHeading = heading;
  if (!vizFrame) vizFrame = requestAnimationFrame(drawViz);
}

function drawViz() {
  vizFrame = null;
  const w = canvas.width, h = canvas.height, cx = w/2, cy = h/2;
  const r = Math.min(cx, cy) - 4;
  ctx.clearRect(0, 0, w, h);

  // BG
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  bg.addColorStop(0, '#0d0d25'); bg.addColorStop(1, '#080812');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();

  // Rings & crosshairs
  ctx.strokeStyle = 'rgba(30,30,70,0.8)'; ctx.lineWidth = 1;
  for (let ri = 1; ri <= 3; ri++) {
    ctx.beginPath(); ctx.arc(cx, cy, r*ri/3, 0, Math.PI*2); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(30,30,70,0.6)';
  ctx.beginPath();
  ctx.moveTo(cx-r, cy); ctx.lineTo(cx+r, cy);
  ctx.moveTo(cx, cy-r); ctx.lineTo(cx, cy+r);
  ctx.stroke();

  // Cardinals
  ctx.fillStyle = 'rgba(74,90,106,0.9)'; ctx.font = '9px Share Tech Mono'; ctx.textAlign = 'center';
  ctx.fillText('N', cx, cy-r+12); ctx.fillText('S', cx, cy+r-4);
  ctx.textAlign = 'left';  ctx.fillText('E', cx+r-10, cy+4);
  ctx.textAlign = 'right'; ctx.fillText('W', cx-r+10, cy+4);
  ctx.textAlign = 'center';

  // Speed ring
  if (vizSpeed > 0) {
    const sr = (vizSpeed/255)*r*0.85;
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, sr);
    grd.addColorStop(0, 'rgba(0,240,255,0.07)'); grd.addColorStop(1, 'rgba(0,240,255,0.02)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, sr, 0, Math.PI*2); ctx.fill();
  }

  // Arrow
  const rad = (vizHeading - 90) * Math.PI / 180;
  const al  = vizSpeed > 5 ? r*0.7*(vizSpeed/255 + 0.3) : r*0.35;
  const tx  = cx + Math.cos(rad)*al, ty = cy + Math.sin(rad)*al;

  if (vizSpeed > 0) {
    ctx.strokeStyle = 'rgba(0,240,255,0.2)'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tx, ty); ctx.stroke();
  }
  ctx.strokeStyle = vizSpeed > 5 ? '#00f0ff' : 'rgba(0,240,255,0.5)';
  ctx.lineWidth = 2; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = vizSpeed > 5 ? 10 : 4;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tx, ty); ctx.stroke();

  // Arrowhead
  const ah = 10, aw = 5, pr = rad + Math.PI/2;
  ctx.fillStyle = vizSpeed > 5 ? '#00f0ff' : 'rgba(0,240,255,0.5)';
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx - ah*Math.cos(rad) + aw*Math.cos(pr), ty - ah*Math.sin(rad) + aw*Math.sin(pr));
  ctx.lineTo(tx - ah*Math.cos(rad) - aw*Math.cos(pr), ty - ah*Math.sin(rad) - aw*Math.sin(pr));
  ctx.closePath(); ctx.fill();

  // Centre dot
  ctx.shadowBlur = 0; ctx.fillStyle = '#7b2fff'; ctx.shadowColor = '#7b2fff'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Heading text
  ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 13px Orbitron';
  ctx.fillText(`${vizHeading}°`, cx, cy + r - 14);
}
drawViz();

// ═══════════════════════════════════════════════════════════════════════════
// COLORS
// ═══════════════════════════════════════════════════════════════════════════

const PRESETS = [
  [0,240,255,'#00f0ff'],[123,47,255,'#7b2fff'],[255,47,110,'#ff2f6e'],
  [0,255,136,'#00ff88'],[255,170,0,'#ffaa00'],[255,255,255,'#ffffff'],
  [255,0,0,'#ff0000'],[0,0,255,'#0000ff'],
];
let activeColor = 0;

function buildColorPresets() {
  const c = document.getElementById('color-presets');
  PRESETS.forEach(([r,g,b,hex], i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (i===0?' active':'');
    sw.style.background = hex;
    sw.addEventListener('click', () => {
      document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active'); activeColor = i;
      setAllLEDs(r,g,b); log(`Color: ${hex}`, 'ok');
    });
    c.appendChild(sw);
  });
}

function cycleColor() {
  activeColor = (activeColor+1) % PRESETS.length;
  const [r,g,b] = PRESETS[activeColor];
  document.querySelectorAll('.color-swatch').forEach((s,i)=>s.classList.toggle('active',i===activeColor));
  setAllLEDs(r,g,b);
}

// ═══════════════════════════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════════════════════════

function updateSpheroStatus(state) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('sphero-status');
  const bc  = document.getElementById('btn-connect-sphero');
  const bd  = document.getElementById('btn-disconnect');
  dot.className = state==='connected' ? 'connected' : state==='connecting' ? 'connecting' : '';
  if (state==='connected')  { txt.textContent='Connected';   txt.className='value green'; bc.disabled=true;  bd.disabled=false; }
  else if (state==='connecting') { txt.textContent='Connecting…'; txt.className='value warn';  bc.disabled=true;  bd.disabled=true; }
  else                      { txt.textContent='Disconnected';txt.className='value red';   bc.disabled=false; bd.disabled=true; }
}

const logEl = document.getElementById('log');
function log(msg, type='log') {
  const line = document.createElement('div');
  line.className = `log-line ${type}`; line.textContent = msg;
  logEl.appendChild(line); logEl.scrollTop = logEl.scrollHeight;
  while (logEl.children.length > 60) logEl.removeChild(logEl.firstChild);
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════════════════════════════════
// BUTTON WIRING
// ═══════════════════════════════════════════════════════════════════════════

document.getElementById('btn-connect-sphero').addEventListener('click', connectSphero);
document.getElementById('btn-disconnect').addEventListener('click', disconnectSphero);
document.getElementById('btn-calibrate').addEventListener('click', async () => {
  aimMode = !aimMode;
  if (aimMode) {
    await stopRoll();
    await setAimLED(255);
    updateAimButton(true);
    log('Aim mode ON — use heading offset slider to aim', 'info');
    toast('Aim mode ON');
  } else {
    await setAimLED(0);
    updateAimButton(false);
    log(`Aim mode OFF — offset: ${headingOffset}°`, 'ok');
    toast(`Aim set: ${headingOffset}°`);
  }
});
document.getElementById('btn-wake').addEventListener('click', async () => { await sendPacket(buildPacket(DID_POWER, CMD_WAKE)); log('Wake sent','ok'); });
document.getElementById('btn-sleep').addEventListener('click', async () => { await sendPacket(buildPacket(DID_POWER, CMD_SLEEP)); log('Sleep sent','ok'); });
document.getElementById('estop').addEventListener('click', async () => { await stopRoll(); toast('STOP!'); });
document.getElementById('btn-set-color').addEventListener('click', () => {
  const hex = document.getElementById('custom-color').value;
  setAllLEDs(parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16));
  log(`Custom color: ${hex}`,'ok');
});
document.getElementById('speed-limit').addEventListener('input', e => { document.getElementById('speed-limit-val').textContent = e.target.value; });
document.getElementById('heading-offset').addEventListener('input', e => {
  headingOffset = parseInt(e.target.value);
  document.getElementById('heading-offset-val').textContent = `${headingOffset}°`;
  document.getElementById('heading-display-chip').textContent = `${headingOffset}°`;
  updateViz(0, headingOffset);
});

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════

function updateAimButton(active) {
  const btn = document.getElementById('btn-calibrate');
  if (active) {
    btn.textContent = '◎ Aiming…';
    btn.style.borderColor = 'var(--warn)';
    btn.style.color = 'var(--warn)';
    btn.style.boxShadow = '0 0 10px var(--warn)';
  } else {
    btn.textContent = '⊕ Aim';
    btn.style.borderColor = '';
    btn.style.color = '';
    btn.style.boxShadow = '';
  }
}

buildColorPresets();
// Start drive loop even before gamepad is detected (it idles until needed)
driveLoop = requestAnimationFrame(pollGamepad);

if (!navigator.bluetooth) {
  log('Web Bluetooth NOT available. Open in Chrome on Android.', 'error');
  document.getElementById('btn-connect-sphero').disabled = true;
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => log('PWA ready (offline capable)','info'))
    .catch(e => log(`SW: ${e.message}`,'warn'));
}
</script>
